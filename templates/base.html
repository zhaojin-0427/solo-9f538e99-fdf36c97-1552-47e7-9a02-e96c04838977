<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}装车秤单复核{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="{{ url_for('index') }}">港口装车秤单复核</a>
    <nav><a href="{{ url_for('index') }}">上传 / 暂扣</a><a href="{{ url_for('index') }}#query">名次查询</a></nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <section class="flashes" aria-label="操作提示">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </section>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="wrap footer">
  <span>Flask + SQLite；小计键上限 576，查询页显示实际访问数。</span>
</footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
